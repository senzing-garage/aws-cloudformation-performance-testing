  # -- Cloud, subnets, routing --------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-ec2-vpc.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#vpcs > Search for {stack}

  Ec2Vpc:
    Properties:
      CidrBlock: !FindInMap
        - VpcCidrs
        - vpc
        - cidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-vpc'
    Type: AWS::EC2::VPC

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-ec2-subnet.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#subnets > Search for {stack}

  Ec2SubnetPrivate1:
    Properties:
      AvailabilityZone: !Select
        - 0
        - !GetAZs
          Ref: AWS::Region
      CidrBlock: !FindInMap
        - VpcCidrs
        - privsubnet1
        - cidr
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-subnet-private-1'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::Subnet

  Ec2SubnetPrivate2:
    Properties:
      AvailabilityZone: !Select
        - 1
        - !GetAZs
          Ref: AWS::Region
      CidrBlock: !FindInMap
        - VpcCidrs
        - privsubnet2
        - cidr
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-subnet-private-2'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::Subnet

  Ec2SubnetPublic1:
    Properties:
      AvailabilityZone: !Select
        - 0
        - !GetAZs
          Ref: AWS::Region
      CidrBlock: !FindInMap
        - VpcCidrs
        - pubsubnet1
        - cidr
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-subnet-public-1'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::Subnet

  Ec2SubnetPublic2:
    Properties:
      AvailabilityZone: !Select
        - 1
        - !GetAZs
          Ref: AWS::Region
      CidrBlock: !FindInMap
        - VpcCidrs
        - pubsubnet2
        - cidr
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-subnet-public-2'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::Subnet

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-ec2-eip.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#Addresses: > Search for {stack}

  Ec2Eip:
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-eip'
    Type: AWS::EC2::EIP

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-ec2-natgateway.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#NatGateways: > Search for {stack}

  Ec2NatGateway:
    Properties:
      AllocationId: !GetAtt Ec2Eip.AllocationId
      SubnetId: !Ref Ec2SubnetPublic1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-nat-gateway'
    Type: AWS::EC2::NatGateway

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-ec2-security-group.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#SecurityGroups > Search for {stack}

  Ec2SecurityGroupInternal:
    Properties:
      GroupDescription: !Sub '${AWS::StackName} - ECS internal open ports.'
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: All
          IpProtocol: '-1'
      SecurityGroupIngress:
        - CidrIp: !FindInMap
            - VpcCidrs
            - vpc
            - cidr
          Description: SSH
          FromPort: 22
          IpProtocol: tcp
          ToPort: 22
        - CidrIp: !FindInMap
            - VpcCidrs
            - vpc
            - cidr
          Description: HTTP
          FromPort: 80
          IpProtocol: tcp
          ToPort: 80
        - CidrIp: !FindInMap
            - VpcCidrs
            - vpc
            - cidr
          Description: HTTPS
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
        - CidrIp: !FindInMap
            - VpcCidrs
            - vpc
            - cidr
          Description: NFS
          FromPort: 2049
          IpProtocol: tcp
          ToPort: 2049
        - CidrIp: !FindInMap
            - VpcCidrs
            - vpc
            - cidr
          Description: PostgreSQL
          FromPort: 5432
          IpProtocol: tcp
          ToPort: 5432
        - CidrIp: !FindInMap
            - VpcCidrs
            - vpc
            - cidr
          Description: Senzing API server
          FromPort: 8250
          IpProtocol: tcp
          ToPort: 8250
        - CidrIp: !FindInMap
            - VpcCidrs
            - vpc
            - cidr
          Description: Senzing Web App
          FromPort: 8251
          IpProtocol: tcp
          ToPort: 8251
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-security-group-internal'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::SecurityGroup

  Ec2SecurityGroupLambdaRunner:
    Properties:
      GroupDescription: !Sub '${AWS::StackName} - Lambda open ports.'
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: All
          IpProtocol: '-1'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-security-group-lambda-runner'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::SecurityGroup

  Ec2SecurityGroupLoadBalancerPrivate:
    Properties:
      GroupDescription: !Sub '${AWS::StackName} - Private load balancer open ports.'
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: All
          IpProtocol: '-1'
      SecurityGroupIngress:
        - CidrIp: !FindInMap
            - VpcCidrs
            - vpc
            - cidr
          Description: Senzing API server
          FromPort: 8250
          IpProtocol: tcp
          ToPort: 8250
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-security-group-alb-private'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::SecurityGroup

  Ec2SecurityGroupLoadBalancerPublic:
    Condition: IfUsingWeb
    Properties:
      GroupDescription: !Sub '${AWS::StackName} - Public load balancer open ports.'
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: All
          IpProtocol: '-1'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-security-group-alb-public'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::SecurityGroup

  Ec2SecurityGroupSshd:
    Condition: IfRunSshd
    Properties:
      GroupDescription: !Sub '${AWS::StackName} - SSHD service open ports.'
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: All
          IpProtocol: '-1'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-security-group-sshd'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::SecurityGroup

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-ec2-security-group-ingress.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#SecurityGroups: > Search for {stack}-ec2-security-group-alb-public > Inbound rules

  Ec2SecurityGroupIngressApiServerPublic:
    Condition: IfUsingApiServer
    Properties:
      Description: Allow Health Check on Container 8250 from ALB
      FromPort: 8250
      GroupId: !GetAtt Ec2SecurityGroupLoadBalancerPublic.GroupId
      IpProtocol: tcp
      SourceSecurityGroupId: !GetAtt Ec2SecurityGroupLoadBalancerPublic.GroupId
      ToPort: 8250
    Type: AWS::EC2::SecurityGroupIngress

  Ec2SecurityGroupIngressApiServerPrivate:
    Condition: IfUsingApiServer
    Properties:
      CidrIp: !FindInMap
        - VpcCidrs
        - vpc
        - cidr
      Description: Senzing API server
      FromPort: 8250
      GroupId: !GetAtt Ec2SecurityGroupLoadBalancerPrivate.GroupId
      IpProtocol: tcp
      ToPort: 8250
    Type: AWS::EC2::SecurityGroupIngress

  Ec2SecurityGroupIngressHttps:
    Condition: IfUsingWeb
    Properties:
      CidrIp: !Ref CidrInbound
      Description: HTTPS
      FromPort: 443
      GroupId: !GetAtt Ec2SecurityGroupLoadBalancerPublic.GroupId
      IpProtocol: tcp
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress

  Ec2SecurityGroupIngressNFS:
    Properties:
      CidrIp: !FindInMap
        - VpcCidrs
        - vpc
        - cidr
      Description: NFS
      FromPort: 2049
      IpProtocol: tcp
      GroupId: !GetAtt Ec2SecurityGroupLoadBalancerPrivate.GroupId
      ToPort: 2049
    Type: AWS::EC2::SecurityGroupIngress

  Ec2SecurityGroupIngressSsh:
    Condition: IfRunSshd
    Properties:
      CidrIp: !Ref CidrInbound
      Description: SSH
      FromPort: 22
      GroupId: !Ref Ec2SecurityGroupSshd
      IpProtocol: tcp
      ToPort: 22
    Type: AWS::EC2::SecurityGroupIngress

  Ec2SecurityGroupIngressWebApp:
    Condition: IfRunWebApp
    Properties:
      Description: Allow Health Check on Container 8251 from ALB
      FromPort: 8251
      GroupId: !GetAtt Ec2SecurityGroupLoadBalancerPublic.GroupId
      IpProtocol: tcp
      SourceSecurityGroupId: !GetAtt Ec2SecurityGroupLoadBalancerPublic.GroupId
      ToPort: 8251
    Type: AWS::EC2::SecurityGroupIngress

  Ec2SecurityGroupIngressWebAppWss:
    Condition: IfRunWebApp
    Properties:
      Description: Allow Websocket on Container port 8255 from ALB
      FromPort: 8255
      GroupId: !GetAtt Ec2SecurityGroupLoadBalancerPublic.GroupId
      IpProtocol: tcp
      SourceSecurityGroupId: !GetAtt Ec2SecurityGroupLoadBalancerPublic.GroupId
      ToPort: 8255
    Type: AWS::EC2::SecurityGroupIngress

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-ec2-internetgateway.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#igws > Search for {stack}

  Ec2InternetGateway:
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-internet-gateway'
    Type: AWS::EC2::InternetGateway

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-ec2-vpc-gateway-attachment.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#igws > Search for {stack} > State & VPI ID

  Ec2VpcGatewayAttachment:
    Properties:
      InternetGatewayId: !Ref Ec2InternetGateway
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::VPCGatewayAttachment

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-ec2-route-table.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#RouteTables > Search for {stack}

  Ec2RouteTablePrivate:
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-route-table-private'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::RouteTable

  Ec2RouteTablePublic:
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-route-table-public'
      VpcId: !Ref Ec2Vpc
    Type: AWS::EC2::RouteTable

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-ec2-route.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#RouteTables > {name} > "Routes" tab

  Ec2RoutePrivate:
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Ec2NatGateway
      RouteTableId: !Ref Ec2RouteTablePrivate
    Type: AWS::EC2::Route

  Ec2RoutePublic:
    DependsOn:
      - Ec2VpcGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Ec2InternetGateway
      RouteTableId: !Ref Ec2RouteTablePublic
    Type: AWS::EC2::Route

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-ec2-subnet-route-table-assoc.html
  # AWS Console: https://console.aws.amazon.com/vpc/home?#RouteTables > {name} > "Subnet Associations" tab

  Ec2SubnetRouteTableAssociationPrivate1:
    Properties:
      RouteTableId: !Ref Ec2RouteTablePrivate
      SubnetId: !Ref Ec2SubnetPrivate1
    Type: AWS::EC2::SubnetRouteTableAssociation

  Ec2SubnetRouteTableAssociationPrivate2:
    Properties:
      RouteTableId: !Ref Ec2RouteTablePrivate
      SubnetId: !Ref Ec2SubnetPrivate2
    Type: AWS::EC2::SubnetRouteTableAssociation

  Ec2SubnetRouteTableAssociationPublic1:
    Properties:
      RouteTableId: !Ref Ec2RouteTablePublic
      SubnetId: !Ref Ec2SubnetPublic1
    Type: AWS::EC2::SubnetRouteTableAssociation

  Ec2SubnetRouteTableAssociationPublic2:
    Properties:
      RouteTableId: !Ref Ec2RouteTablePublic
      SubnetId: !Ref Ec2SubnetPublic2
    Type: AWS::EC2::SubnetRouteTableAssociation

  # -- Database -----------------------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-rds-dbsubnet-group.html
  # AWS Console: https://console.aws.amazon.com/rds/home#db-subnet-groups-list: > Search for {stack}

  RdsDbSubnetGroup:
    Properties:
      DBSubnetGroupDescription: !Sub '${AWS::StackName}-db-subnet-description'
      DBSubnetGroupName: !Sub '${AWS::StackName}-db-subnet'
      SubnetIds:
        - !Ref Ec2SubnetPrivate1
        - !Ref Ec2SubnetPrivate2
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rds-db-subnet-group'
    Type: AWS::RDS::DBSubnetGroup

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-rds-dbclusterparametergroup.html
  # AWS Console: https://console.aws.amazon.com/rds/home?#parameter-groups: > Search for {stack}

  RdsDbClusterParameterGroup:
    Properties:
      Description: !Sub '${AWS::StackName}-rds-db-cluster-parameter-group-description'
      Family: aurora-postgresql17
      Parameters:
        # shared_preload_libraries is a cluster-level static parameter on Aurora.
        # Belongs here, not on the instance parameter group, or pg_stat_statements
        # won't actually load.
        shared_preload_libraries: 'pg_stat_statements'
        autovacuum_max_workers: 5
        enable_seqscan: 0
        # pglogical.synchronous_commit: 0
        # synchronous_commit: 'off'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rds-db-cluster-parameter-group'
    Type: AWS::RDS::DBClusterParameterGroup

  RdsDbParameterGroup:
    Properties:
      Description: !Sub '${AWS::StackName}-rds-db-parameter-group-description'
      Family: aurora-postgresql17
      Parameters:
        track_io_timing: 1
        # Raise above the Aurora default (~5,000 on r6i.24xlarge). At 100M the
        # Redoer + Consumer fleets autoscale to MaxCapacity 200 × 20 threads =
        # up to 8,000 connections; the flawed 4.4 run peaked at 327 tasks (~6,540)
        # and exhausted the default pool ("remaining connection slots are reserved
        # for roles with the SUPERUSER attribute" — the rds_superuser app account
        # gets NONE of the reserved slots), silently losing records.
        # max_connections is INCLUSIVE of the reserve, so 8000 (== worst-case
        # demand, zero overhead headroom) would re-trigger the FATAL. 10000 leaves
        # ~20% margin over worst-case fleet + overhead; memory-safe on 768 GiB.
        # NOTE: superuser_reserved_connections is NOT settable in an Aurora DB
        # parameter group (CREATE fails: "Invalid/Unmodifiable/Unsupported"), and
        # isn't needed — the default reserve is trivial against the 10000 ceiling.
        max_connections: '10000'
        work_mem: '4096'   # pin Aurora default (kB) so the memory-safety margin can't silently change
        # pglogical.synchronous_commit: 0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rds-db-parameter-group'
    Type: AWS::RDS::DBParameterGroup

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-rds-dbcluster.html
  # AWS Console: https://console.aws.amazon.com/rds/home?#databases: > Search for {stack}

  RdsDbClusterCore:
    DependsOn:
      - LogsLogGroupDbClusterCore
      - RdsDbSubnetGroup
    # Ephemeral perf-test stack: skip the default final-snapshot on delete so
    # teardown is fast and we don't accumulate orphaned snapshots across runs.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AvailabilityZones:
        - !GetAtt Ec2SubnetPrivate1.AvailabilityZone
        - !GetAtt Ec2SubnetPrivate2.AvailabilityZone
      BackupRetentionPeriod: 1
      DatabaseName: !FindInMap [Constants, Database, Name]
      DBClusterIdentifier: !Sub '${AWS::StackName}-aurora-senzing-core-cluster'
      DBClusterParameterGroupName:
        Ref: RdsDbClusterParameterGroup
      # FIXME: Tricky code.  See https://console.aws.amazon.com/support/home#/case/?displayId=7725760511
      DBSubnetGroupName: !Sub
        - '${StackNameAsLower}-db-subnet'
        - StackNameAsLower: !GetAtt LambdaRunnerStackNameAsLower.OutputString
      DeletionProtection: false
      EnableCloudwatchLogsExports:
        - postgresql
      EnableHttpEndpoint: true
      Engine: aurora-postgresql
      EngineMode: provisioned
      EngineVersion: '17.5'
      MasterUsername: !FindInMap [Constants, Database, Username]
      MasterUserPassword: !GetAtt LambdaRunnerDbPassword.RandomString
      Port: 5432
      # 06:00-06:30 UTC backup window - off-hours for US-based perf runs. Adjust if
      # your test schedule conflicts.
      PreferredBackupWindow: '06:00-06:30'
      StorageEncrypted: true
      # StorageType: aurora
      StorageType: aurora-iopt1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rds-db-core-cluster'
      VpcSecurityGroupIds:
        - !Ref Ec2SecurityGroupInternal
    Type: AWS::RDS::DBCluster

  RdsDbInstanceCore1:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBSubnetGroupName: !Sub
        - '${StackNameAsLower}-db-subnet'
        - StackNameAsLower: !GetAtt LambdaRunnerStackNameAsLower.OutputString
      DBParameterGroupName:
        Ref: RdsDbParameterGroup
      EnablePerformanceInsights: true
      Engine: aurora-postgresql
      DBClusterIdentifier:
        Ref: RdsDbClusterCore
      PubliclyAccessible: 'false'
      AvailabilityZone: !GetAtt Ec2SubnetPrivate1.AvailabilityZone
      # DBInstanceClass: db.r7g.8xlarge
      # DBInstanceClass: db.r7g.12xlarge
      # DBInstanceClass: db.r7g.16xlarge
      # DBInstanceClass: db.r6i.4xlarge
      DBInstanceClass: db.r6i.8xlarge
      # DBInstanceClass: db.r6i.12xlarge
      # DBInstanceClass: db.r6i.16xlarge
      # DBInstanceClass: db.r6i.24xlarge
      # DBInstanceClass: db.r6i.32xlarge
      # DBInstanceClass: db.r6id.32xlarge
      # DBInstanceClass: db.r6id.24xlarge
      # DBInstanceClass: db.r6gd.16xlarge
      # DBInstanceClass: db.r6gd.12xlarge
    Type: AWS::RDS::DBInstance

  RdsDbInstanceCore2:
    Condition: IfEnableReadOnlyConnection
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBSubnetGroupName: !Sub
        - '${StackNameAsLower}-db-subnet'
        - StackNameAsLower: !GetAtt LambdaRunnerStackNameAsLower.OutputString
      DBParameterGroupName:
        Ref: RdsDbParameterGroup
      EnablePerformanceInsights: true
      Engine: aurora-postgresql
      DBClusterIdentifier:
        Ref: RdsDbClusterCore
      PubliclyAccessible: 'false'
      # Co-located with the writer (AZ1) so the cluster-ro endpoint stays in the
      # same AZ as the loader/redoer compute. Eliminates the cross-AZ tax on
      # read-offload reads and makes the A/B vs. writer-only baseline fair.
      AvailabilityZone: !GetAtt Ec2SubnetPrivate1.AvailabilityZone
      DBInstanceClass: db.r6i.8xlarge
    Type: AWS::RDS::DBInstance

  # -- Queue --------------------------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-sqs-queues.html
  # AWS Console: https://console.aws.amazon.com/sqs/v2/home > Search on {stack}

  SqsInput:
    Condition: IfUsingQueues
    Properties:
      DelaySeconds: 0
      KmsMasterKeyId: alias/aws/sqs
      MaximumMessageSize: 262144
      MessageRetentionPeriod: 1209600
      QueueName: !Sub '${AWS::StackName}-sqs-input'
      # Long polling reduces empty receives at low queue depth without hurting
      # steady-state throughput.
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - SqsDeadLetter
            - Arn
        maxReceiveCount: 5
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sqs-input'
      # 30 min: generous for slow Senzing batches but ~8x faster DLQ feedback
      # than the previous 4h. Raise back if real batches exceed this.
      VisibilityTimeout: 1800
    Type: AWS::SQS::Queue

