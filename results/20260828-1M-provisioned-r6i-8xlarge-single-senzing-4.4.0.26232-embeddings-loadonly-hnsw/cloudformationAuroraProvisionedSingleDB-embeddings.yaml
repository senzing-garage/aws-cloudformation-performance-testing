  # One-shot task that prepares the database for embedding storage: enables the
  # pgvector extension and pre-creates the NAME_EMBEDDING / BIZNAME_EMBEDDING vector
  # tables (the Senzing engine writes embedding vectors into these natively during
  # load). Runs after the Senzing schema is created and before the config-tool step.
  # HNSW indexes are built HERE, before the load, so embedding inserts pay the realistic
  # HNSW graph-maintenance cost. Production systems load into an already-indexed table, not
  # an empty one, so empty-table load numbers overstate embedding throughput. (The ops class
  # should match the engine's vector-search distance operator; vector_cosine_ops = cosine.)
  EcsTaskDefinitionInitPgvector:
    Properties:
      ContainerDefinitions:
        - Command:
            - '/bin/bash'
            - '-c'
            - |
              set -e
              echo "Enabling pgvector, creating embedding vector tables + HNSW indexes on ${PGHOST}:${PGPORT}/${PGDATABASE}"
              # One table per embedding feature the data can use. The engine writes the
              # vector into the table NAMED AFTER THE FEATURE the attribute maps to:
              #   NAME_EMBEDDINGS attr    -> NAME_EMBEDDING feature    -> NAME_EMBEDDING table (persons)
              #   BIZNAME_EMBEDDINGS attr -> BIZNAME_EMBEDDING feature -> BIZNAME_EMBEDDING table (orgs)
              #   SEMANTIC_EMBEDDINGS attr-> SEMANTIC_VALUE feature (built-in FTYPE 99) -> SEMANTIC_VALUE table
              # The OpenSanctions "fixed" datasets use SEMANTIC_EMBEDDINGS for orgs + NAME_EMBEDDINGS
              # for persons, so SEMANTIC_VALUE is REQUIRED (missing it -> SENZ1019 "relation
              # semantic_value does not exist" and every semantic record fails).
              psql -v ON_ERROR_STOP=1 \
                -c "CREATE EXTENSION IF NOT EXISTS vector;" \
                -c "CREATE TABLE IF NOT EXISTS NAME_EMBEDDING (LIB_FEAT_ID BIGINT NOT NULL, LABEL TEXT NOT NULL, EMBEDDING VECTOR(512), PRIMARY KEY(LIB_FEAT_ID));" \
                -c "CREATE TABLE IF NOT EXISTS BIZNAME_EMBEDDING (LIB_FEAT_ID BIGINT NOT NULL, LABEL TEXT NOT NULL, EMBEDDING VECTOR(512), PRIMARY KEY(LIB_FEAT_ID));" \
                -c "CREATE TABLE IF NOT EXISTS SEMANTIC_VALUE (LIB_FEAT_ID BIGINT NOT NULL, LABEL TEXT NOT NULL, EMBEDDING VECTOR(512), PRIMARY KEY(LIB_FEAT_ID));" \
                -c "CREATE INDEX IF NOT EXISTS name_embedding_hnsw ON NAME_EMBEDDING USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 100);" \
                -c "CREATE INDEX IF NOT EXISTS bizname_embedding_hnsw ON BIZNAME_EMBEDDING USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 100);" \
                -c "CREATE INDEX IF NOT EXISTS semantic_value_hnsw ON SEMANTIC_VALUE USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 100);"
              echo "pgvector setup complete (tables + HNSW indexes built; embedding inserts pay HNSW maintenance during the load)"
          Environment:
            - Name: PGHOST
              Value: !GetAtt RdsDbClusterCore.Endpoint.Address
            - Name: PGPORT
              Value: !Sub '${RdsDbClusterCore.Endpoint.Port}'
            - Name: PGUSER
              Value: !FindInMap [Constants, Database, Username]
            - Name: PGPASSWORD
              Value: !GetAtt LambdaRunnerDbPassword.RandomString
            - Name: PGDATABASE
              Value: !FindInMap [Constants, Database, Name]
          Essential: true
          Image: !FindInMap [Constants, Images, PostgresClient]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogsLogGroupMain
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: job
          Name: initpgvector
          Privileged: false
          ReadonlyRootFilesystem: false
      Cpu: '512'
      ExecutionRoleArn: !GetAtt IamRoleInitPostgres.Arn
      Family: !Sub '${AWS::StackName}-task-definition-init-pgvector'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ecs-task-definition-init-pgvector'
    Type: AWS::ECS::TaskDefinition

