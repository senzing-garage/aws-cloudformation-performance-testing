AWSTemplateFormatVersion: 2010-09-09

# File format follows https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/template-anatomy.html
# Tests:
#     Lint: https://github.com/aws-cloudformation/cfn-python-lint
#     Nag: https://github.com/stelligent/cfn_nag
#     aws cloudformation validate-template: https://awscli.amazonaws.com/v2/documentation/api/latest/reference/cloudformation/validate-template.html
# This cloudformation template should be nearly identical to
#   https://github.com/senzing-garage/aws-cloudformation-ecs-poc-simple
# But tailored to run use Senzing RPMs from the staging server.

Description: >-
  Senzing aws-cloudformation-ecs-staging-simple-100M Version: 1.0.16
  For more information see
  https://github.com/senzing-garage/aws-cloudformation-ecs/tree/main/cloudformation/aws-cloudformation-ecs-staging-simple-100M

# -----------------------------------------------------------------------------
# Metadata
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/metadata-section-structure.html
# -----------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Senzing installation
        Parameters:
          - RecordMax
          - SenzingLicenseAsBase64
      - Label:
          default: Security
        Parameters:
          - CognitoAdminEmail
          - CidrInbound
          # - RunDataEncryption
      - Label:
          default: 'Optional: Initial data load'
        Parameters:
          - RunStreamProducer
      - Label:
          default: 'Optional: Read-offload (Aurora reader replica + Senzing READ_ONLY_CONNECTION)'
        Parameters:
          - EnableReadOnlyConnection
          - ReadOnlyConnections
      - Label:
          default: 'Optional: Entity lock mode (Senzing ER ENTITY_LOCK_MODE)'
        Parameters:
          - EnableEntityLockModeAdvisory
    ParameterLabels:
      CidrInbound:
        default: 'Optional: Provide the permitted IP address block allowed to connect using CIDR notation.'
      CognitoAdminEmail:
        default: 'Required: Provide the email address for the administrative user.'
      EnableEntityLockModeAdvisory:
        default: 'Optional: Add "ER": {"ENTITY_LOCK_MODE": "ADVISORY"} to the Senzing engine config.'
      EnableReadOnlyConnection:
        default: 'Optional: Add an Aurora reader replica and route Senzing LIB_FEAT reads to it via READ_ONLY_CONNECTION.'
      ReadOnlyConnections:
        default: 'Optional: Number of connections in the Senzing read-only pool (only used when EnableReadOnlyConnection=true).'
      RecordMax:
        default: 'Required: Number of records to insert.'
      RunStreamProducer:
        default: 'Optional: Would you like to have an initial set of data imported?'
      # RunDataEncryption:
      #   default: "Optional: Would you like to run with data encryption enabled?"
      SenzingLicenseAsBase64:
        default: >-
          The Senzing Evaluation comes with 100k free records of entity resolution.
          If using more than 100k records, please input base 64 encoded license string.

# -----------------------------------------------------------------------------
# Parameters
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/parameters-section-structure.html
# -----------------------------------------------------------------------------

Parameters:
  # AWS Console: https://console.aws.amazon.com/cloudformation/home?#/stacks > {stack} > Parameters

  CidrInbound:
    AllowedPattern: '(?:\d{1,3}\.){3}\d{1,3}(?:/\d\d?)?'
    ConstraintDescription: Inbound CIDR must be in the format n.n.n.n/n
    MinLength: 9
    MaxLength: 18
    Default: 0.0.0.0/0
    Description: 'Help: https://hub.senzing.com/aws-cloudformation-ecs/aws-cloudformation-ecs-staging-simple-100M/#cidrinbound'
    Type: String

  CognitoAdminEmail:
    AllowedPattern: '.+|^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$'
    ConstraintDescription: Entering initial user email address is required to proceed
    Default: '_'
    Description: 'Help: https://hub.senzing.com/aws-cloudformation-ecs/aws-cloudformation-ecs-staging-simple-100M/#cognitoadminemail'
    Type: String

  EnableEntityLockModeAdvisory:
    AllowedValues:
      - 'false'
      - 'true'
    Default: 'false'
    Description: >-
      When true, add an "ER" section with "ENTITY_LOCK_MODE": "ADVISORY" to the Senzing engine
      config as a sibling of "PIPELINE" and "SQL". Default false omits the section entirely.
    Type: String

  EnableReadOnlyConnection:
    AllowedValues:
      - 'false'
      - 'true'
    Default: 'false'
    Description: >-
      When true, add one Aurora reader replica to the cluster (same instance class as the writer)
      and add READ_ONLY_CONNECTION / READ_ONLY_CONNECTIONS to the Senzing engine config so
      LIB_FEAT / LIB_FEAT_HKEY reads are routed through the cluster reader endpoint. Writes still
      go to the primary. Default false matches the original single-instance topology.
    Type: String

  ReadOnlyConnections:
    Default: 8
    Description: >-
      Size of the Senzing read-only connection pool. Only used when EnableReadOnlyConnection=true.
    MinValue: 1
    MaxValue: 64
    Type: Number

  RecordMax:
    AllowedValues:
      - '1'
      - '1M'
      - '5M'
      - '10M'
      - '20M'
      - '25M'
      - '50M'
      - '75M'
      - '100M'
    Default: '25M'
    Description: 'Help: https://hub.senzing.com/aws-cloudformation-ecs/aws-cloudformation-ecs-staging-simple-100M/#recordmax'
    Type: String

  RunStreamProducer:
    AllowedValues:
      - 'No'
      - 'Yes'
    Default: 'Yes'
    Description: 'Help: https://hub.senzing.com/aws-cloudformation-ecs/aws-cloudformation-ecs-staging-simple-100M/#runstreamproducer'
    Type: String

  # RunDataEncryption:
  #   AllowedValues:
  #     - "No"
  #     - "Yes"
  #   Default: "No"
  #   Description: "Help: https://hub.senzing.com/aws-cloudformation-ecs/aws-cloudformation-ecs-staging-simple-100M/#rundataencryption"
  #   Type: String

  SenzingLicenseAsBase64:
    #   AllowedPattern: ' ^$|[^-A-Za-z0-9+\/=\s]|=[^=]|={3,}$'
    ConstraintDescription: 'Must contain only Base64 characters. see https://hub.senzing.com/aws-cloudformation-ecs/aws-cloudformation-ecs-staging-simple-100M/#senzinglicenseasbase64'
    Default: '_'
    Description: 'Help: https://hub.senzing.com/aws-cloudformation-ecs/aws-cloudformation-ecs-staging-simple-100M/#senzinglicenseasbase64'
    Type: String

# -----------------------------------------------------------------------------
# Rules
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/rules-section-structure.html
# -----------------------------------------------------------------------------

Rules:
  ConfirmCognitoAdminEmail:
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref CognitoAdminEmail
            - '_'
        AssertDescription: 'Entering initial user email address is required to proceed'

  ConfirmSenzingLicenseAsBase64:
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref SenzingLicenseAsBase64
            - '_'
        AssertDescription: 'Senzing license in base64 format is required.'

# -----------------------------------------------------------------------------
# Mappings
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/mappings-section-structure.html
# -----------------------------------------------------------------------------

Mappings:
  # DataEncryptionMap:
  #   "Yes":
  #     value: '
  #       "DATA_ENCRYPTION": {
  #       "ENCRYPTION_PLUGIN_NAME": "g2EncryptDataAES256CBC",
  #       "ENCRYPTION_KEY": "68402346802394406802620602396369",
  #       "ENCRYPTION_INITIALIZATION_VECTOR": "6432072349624624"
  #       },'
  #   "No":
  #     value: ""

  RecordMaxMap:
    '1':
      value: '1'
    '1M':
      value: '1000000'
    '5M':
      value: '5000000'
    '10M':
      value: '10000000'
    '20M':
      value: '20000000'
    '25M':
      value: '25000000'
    '50M':
      value: '50000000'
    '75M':
      value: '75000000'
    '100M':
      value: '100000000'

  Constants:
    Database:
      Name: G2
      Username: senzing
    Images:
      # ApiServer: public.ecr.aws/senzing/senzing-poc-server:3.3.6
      # InitPostgresql: public.ecr.aws/senzing/init-postgresql:1.1.6
      # Redoer: public.ecr.aws/senzing/redoer:2.1.11
      # SenzingApiTools: public.ecr.aws/senzing/senzingapi-tools:3.4.0
      # Sshd: public.ecr.aws/senzing/sshd:1.4.9
      # StreamLoader: public.ecr.aws/senzing/stream-loader:2.2.10
      # StreamProducer: public.ecr.aws/senzing/stream-producer:1.8.4
      # WebApp: public.ecr.aws/senzing/entity-search-web-app:2.7.4

      # ApiServer: public.ecr.aws/senzing/senzing-poc-server:staging
      InitDataEncryption: public.ecr.aws/senzing/data-encryption-aes256cbc-sample:1.0.5
      # InitPostgresql: public.ecr.aws/senzing/init-postgresql:staging
      # Redoer: public.ecr.aws/senzing/redoer:staging
      # SenzingApiTools: public.ecr.aws/senzing/senzingapi-tools:staging
      # Sshd: public.ecr.aws/senzing/sshd:staging
      # StreamLoader: public.ecr.aws/senzing/stream-loader:staging
      # StreamProducer: public.ecr.aws/senzing/stream-producer:1.8.3
      # WebApp: public.ecr.aws/senzing/entity-search-web-app:2.7.3

      # ApiServer: public.ecr.aws/senzing/senzing-poc-server:staging
      # InitPostgresql: public.ecr.aws/senzing/init-postgresql:staging
      # Redoer: public.ecr.aws/senzing/sz_simple_redoer:staging
      # SenzingApiTools: public.ecr.aws/senzing/senzingapi-tools:staging
      # Sshd: public.ecr.aws/senzing/sshd:staging
      # StreamLoader: public.ecr.aws/senzing/sz_sqs_consumer:staging
      # StreamProducer: public.ecr.aws/senzing/stream-producer:1.8.7
      # WebApp: public.ecr.aws/senzing/entity-search-web-app:2.8.0

      # senzing v4
      ApiServer: public.ecr.aws/senzing/senzing-poc-server:staging
      # InitPostgresql: public.ecr.aws/senzing/init-postgresql:staging
      InitPostgresql: docker.io/senzing/init-database:latest
      Redoer: public.ecr.aws/senzing/sz_simple_redoer-v4:4.4.0-26232
      SenzingApiTools: public.ecr.aws/senzing/senzingsdk-tools:4.4.0-26232
      Sshd: public.ecr.aws/senzing/sshd:4.4.0-26232
      StreamLoader: public.ecr.aws/senzing/sz_sqs_consumer-v4:4.4.0-26232
      StreamProducer: public.ecr.aws/senzing/stream-producer:1.8.7
      WebApp: public.ecr.aws/senzing/entity-search-web-app:2.8.0
      # Plain PostgreSQL client image (has psql) for the one-shot pgvector setup task
      # (CREATE EXTENSION vector + the NAME_EMBEDDING / BIZNAME_EMBEDDING vector tables
      # and HNSW indexes). Version matches the Aurora PostgreSQL 17 cluster.
      PostgresClient: public.ecr.aws/docker/library/postgres:17

    Run:
      ApiServer: No
      Redoer: Yes
      Sshd: Yes
      StreamLoader: Yes
      WebApp: No
    Stack:
      Name: perf-prov
    StreamProducer:
      DataSource: TEST
      EntityType: GENERIC
      # Private embedded-feature-data bucket (us-east-1). Read via s3:// so the
      # producer authenticates with its task role (see IamPolicyStreamProducerS3);
      # a plain https URL would be an unsigned request → AccessDenied. Requires the
      # bucket owner's cross-account bucket policy to also allow this stack.
      InputUrl: "https://embedded-feature-data.s3.us-east-1.amazonaws.com/dataset_full.fixed.jsonl?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=...&X-Amz-Date=...&X-Amz-Expires=43200&X-Amz-SignedHeaders=host&X-Amz-Security-Token=...&X-Amz-Signature=<REDACTED>"
      RecordMin: 0

  # NOTE: The CIDRs for subnets may collide with existing subnets.  The values may be altered.

  VpcCidrs:
    vpc:
      cidr: 10.0.0.0/16
    privsubnet1:
      cidr: 10.0.10.0/22
    privsubnet2:
      cidr: 10.0.20.0/22
    pubsubnet1:
      cidr: 10.0.30.0/22
    pubsubnet2:
      cidr: 10.0.40.0/22

# -----------------------------------------------------------------------------
# Conditions
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/conditions-section-structure.html
# -----------------------------------------------------------------------------

Conditions:
  IfEnableReadOnlyConnection: !Equals
    - !Ref EnableReadOnlyConnection
    - 'true'

  IfRunApiServer: !Equals
    - !FindInMap [Constants, Run, ApiServer]
    - Yes

  # IfRunDataEncryption: !Equals
  #   - !Ref RunDataEncryption
  #   - "Yes"

  IfRunRedoer: !Equals
    - !FindInMap [Constants, Run, Redoer]
    - Yes

  IfRunSshd: !Equals
    - !FindInMap [Constants, Run, Sshd]
    - Yes

  IfRunStreamLoader: !Equals
    - !FindInMap [Constants, Run, StreamLoader]
    - Yes

  IfRunStreamProducer: !Equals
    - !Ref RunStreamProducer
    - 'Yes'

  IfRunWebApp: !Equals
    - !FindInMap [Constants, Run, WebApp]
    - Yes

  # -- Compound "if" conditions --------------------------------------------

  IfUsingApiServer: !Or
    - !Condition IfRunApiServer
    - !Condition IfRunWebApp

  IfUsingQueues: !Or
    - !Condition IfRunStreamLoader
    - !Condition IfRunStreamProducer

  IfUsingWeb: !Or
    - !Condition IfRunApiServer
    - !Condition IfRunWebApp

# -----------------------------------------------------------------------------
# Resources
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
# -----------------------------------------------------------------------------

Resources:
  # -- Ssm -----------------------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-ssm-parameter.html
  # AWS Console: https://console.aws.amazon.com/systems-manager/parameters > Search for {stack}

  SsmParameterSenzingEngineConfigurationJson:
    Properties:
      Name: !Sub '${AWS::StackName}-ssm-parameter-senzing-engine-configuration-json'
      Type: String
      Value: !GetAtt LambdaRunnerSenzingEngineConfigurationJson.ConfigJSON
    Type: AWS::SSM::Parameter

  # -- Iam -----------------------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-iam-role.html
  # AWS Console: https://console.aws.amazon.com/iam/home?#/roles > Search for {stack}

  IamRoleApiServer:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
                - sqs.amazonaws.com
        Version: '2012-10-17'
      Description: !Sub '${AWS::StackName}-iam-role-api-server'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role-api-server'
    Type: AWS::IAM::Role

  IamRoleDebug:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
        Version: '2012-10-17'
      Description: !Sub '${AWS::StackName}-iam-role-debug'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role-debug'
    Type: AWS::IAM::Role

  IamRoleG2ConfigTool:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
        Version: '2012-10-17'
      Description: !Sub '${AWS::StackName}-iam-role-g2configtool'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role-g2configtool'
    Type: AWS::IAM::Role

  IamRoleInitPostgres:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
        Version: '2012-10-17'
      Description: !Sub '${AWS::StackName}-iam-role-init-postgres'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role-init-postgres'
    Type: AWS::IAM::Role

  IamRoleLambda:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
                - lambda.amazonaws.com
                - route53.amazonaws.com
                - sqs.amazonaws.com
        Version: '2012-10-17'
      Description: !Sub '${AWS::StackName}-iam-role-lambda'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role-lambda'
    Type: AWS::IAM::Role

  IamRoleRedoer:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
        Version: '2012-10-17'
      Description: !Sub '${AWS::StackName}-iam-role-redoer'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role-redoer'
    Type: AWS::IAM::Role

  IamRoleSshd:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
        Version: '2012-10-17'
      Description: !Sub '${AWS::StackName}-iam-role-sshd'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role-sshd'
    Type: AWS::IAM::Role

  IamRoleStreamLoader:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
                - sqs.amazonaws.com
        Version: '2012-10-17'
      Description: !Sub '${AWS::StackName}-iam-role-stream-loader'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role-stream-loader'
    Type: AWS::IAM::Role

  IamRoleStreamProducer:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
                - sqs.amazonaws.com
        Version: '2012-10-17'
      Description: !Sub '${AWS::StackName}-iam-role-stream-producer'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role-stream-producer'
    Type: AWS::IAM::Role

  IamRoleWebApp:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
        Version: '2012-10-17'
      Description: !Sub '${AWS::StackName}-iam-role-web-app'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role-web-app'
    Type: AWS::IAM::Role

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-iam-policy.html
  # AWS Console: https://console.aws.amazon.com/iam/home?#/roles > Search for {stack} > {role} > inline policy

  IamPolicyCertificateManager:
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-certificate-manager'
      PolicyDocument:
        Statement:
          - Action:
              - acm:ListCertificates
            Effect: Allow
            Resource:
              - '*'
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleLambda
    Type: AWS::IAM::Policy

  IamPolicyCertificates:
    Condition: IfUsingWeb
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-certificates'
      PolicyDocument:
        Statement:
          - Action:
              - iam:UploadServerCertificate
            Effect: Allow
            Resource:
              - !GetAtt IamServerCertificate.Arn
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleLambda
    Type: AWS::IAM::Policy

  IamPolicyCognito:
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-cognito'
      PolicyDocument:
        Statement:
          - Action:
              - cognito-idp:AdminCreateUser
            Effect: Allow
            Resource:
              - '*'
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleLambda
    Type: AWS::IAM::Policy

  IamPolicyLoggingCreateStream:
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-logging-create-stream'
      PolicyDocument:
        Statement:
          - Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Effect: Allow
            Resource:
              - '*'
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleApiServer
        - !Ref IamRoleG2ConfigTool
        - !Ref IamRoleInitPostgres
        - !Ref IamRoleLambda
        - !Ref IamRoleRedoer
        - !Ref IamRoleSshd
        - !Ref IamRoleStreamLoader
        - !Ref IamRoleStreamProducer
        - !Ref IamRoleWebApp
    Type: AWS::IAM::Policy

  IamPolicyPassRole:
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-pass-role'
      PolicyDocument:
        Statement:
          - Action:
              - iam:PassRole
            Effect: Allow
            Resource:
              - !GetAtt IamRoleG2ConfigTool.Arn
              - !GetAtt IamRoleLambda.Arn
              - !GetAtt IamRoleStreamProducer.Arn
              - !GetAtt IamRoleInitPostgres.Arn
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleG2ConfigTool
        - !Ref IamRoleLambda
        - !Ref IamRoleStreamProducer
        - !Ref IamRoleInitPostgres
    Type: AWS::IAM::Policy

  IamPolicyRds:
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-rds'
      PolicyDocument:
        Statement:
          - Action:
              - rds:ModifyDBCluster
            Effect: Allow
            Resource:
              - '*'
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleLambda
    Type: AWS::IAM::Policy

  IamPolicyRoute53:
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-route53'
      PolicyDocument:
        Statement:
          - Action:
              - route53:GetHostedZone
            Effect: Allow
            Resource:
              - '*'
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleLambda
    Type: AWS::IAM::Policy

  IamPolicyS3:
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-s3'
      PolicyDocument:
        Statement:
          - Action:
              - s3:GetObject
            Effect: Allow
            Resource:
              - '*'
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleLambda
    Type: AWS::IAM::Policy

  # Lets the StreamProducer task read the (private) embedded-feature-data bucket
  # via an s3:// SENZING_INPUT_URL. The role policy grants the permission on this
  # side; because the bucket is in us-east-1 and (likely) a DIFFERENT account than
  # this stack, the BUCKET OWNER must ALSO add a bucket policy granting this
  # stack's account / this role s3:GetObject (+ s3:ListBucket). S3 bucket ARNs are
  # region/account-agnostic, so the ARNs below are correct cross-region.
  IamPolicyStreamProducerS3:
    Condition: IfRunStreamProducer
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-stream-producer-s3'
      PolicyDocument:
        Statement:
          - Action:
              - s3:GetObject
            Effect: Allow
            Resource:
              - 'arn:aws:s3:::embedded-feature-data/*'
          - Action:
              - s3:ListBucket
            Effect: Allow
            Resource:
              - 'arn:aws:s3:::embedded-feature-data'
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleStreamProducer
    Type: AWS::IAM::Policy

  IamPolicySqsConsumer:
    Condition: IfUsingQueues
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-sqs-consumer'
      PolicyDocument:
        Statement:
          - Action:
              # ChangeMessageVisibility lets the consumer extend the visibility
              # timeout while it works a long-running (e.g. lock-contended) record.
              # Without it the consumer gets AccessDenied and CRASHES (jae-embed-015
              # finding #3: 2 consumer crashes during the 18:22 contention burst).
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ReceiveMessage
            Effect: Allow
            Resource:
              - !GetAtt SqsDeadLetter.Arn
              - !GetAtt SqsInput.Arn
              - !GetAtt SqsOutput.Arn
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleStreamLoader
    Type: AWS::IAM::Policy

  IamPolicySqsProducer:
    Condition: IfUsingQueues
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-sqs-producer'
      PolicyDocument:
        Statement:
          - Action:
              - sqs:SendMessage
              - sqs:GetQueueAttributes
            Effect: Allow
            Resource:
              - !GetAtt SqsDeadLetter.Arn
              - !GetAtt SqsInput.Arn
              - !GetAtt SqsOutput.Arn
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleStreamLoader
        - !Ref IamRoleStreamProducer
        - !Ref IamRoleApiServer
    Type: AWS::IAM::Policy

  IamPolicyTaskRunner:
    Properties:
      PolicyName: !Sub '${AWS::StackName}-iam-policy-task-runner'
      PolicyDocument:
        Statement:
          - Action:
              - ecs:DescribeTasks
              - ecs:RunTask
            Effect: Allow
            Resource:
              - '*'
        Version: '2012-10-17'
      Roles:
        - !Ref IamRoleApiServer
        - !Ref IamRoleG2ConfigTool
        - !Ref IamRoleLambda
        - !Ref IamRoleRedoer
        - !Ref IamRoleSshd
        - !Ref IamRoleStreamLoader
        - !Ref IamRoleWebApp
    Type: AWS::IAM::Policy

  # -- Logging ------------------------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-logs-loggroup.html
  # AWS Console: https://console.aws.amazon.com/cloudwatch/home?#logsV2:log-groups > Search for {stack}

  # AWS::Logs::LogGroup defaults to DeletionPolicy: Retain. For an ephemeral
  # perf-test stack that's brought up and torn down per Senzing release, set
  # DeletionPolicy: Delete on every log group so the next deploy doesn't fail
  # with "log group already exists".
  LogsLogGroupDbClusterCore:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub
        - '/aws/rds/cluster/${StackNameAsLower}-aurora-senzing-core-cluster/postgresql'
        - StackNameAsLower: !GetAtt LambdaRunnerStackNameAsLower.OutputString
    Type: AWS::Logs::LogGroup

  LogsLogGroupLambdaCognitoCreateUser:
    Condition: IfUsingWeb
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lambda-cognito-create-user'
    Type: AWS::Logs::LogGroup

  LogsLogGroupLambdaGenerateCertificate:
    Condition: IfUsingWeb
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lambda-generate-certificate'
    Type: AWS::Logs::LogGroup

  LogsLogGroupLambdaRandomPassword:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lambda-random-password'
    Type: AWS::Logs::LogGroup

  LogsLogGroupLambdaRandomString:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lambda-random-string'
    Type: AWS::Logs::LogGroup

  LogsLogGroupLambdaRunTask:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lambda-run-task'
    Type: AWS::Logs::LogGroup

  LogsLogGroupLambdaRunTaskAndWait:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lambda-run-task-and-wait'
    Type: AWS::Logs::LogGroup

  LogsLogGroupLambdaSetRdbTimeoutAction:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lambda-set-rdb-timeout-action'
    Type: AWS::Logs::LogGroup

  LogsLogGroupLambdaRunStreamProducerTasks:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lambda-run-stream-producer-tasks'
    Type: AWS::Logs::LogGroup

  LogsLogGroupLambdaStringToLower:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lambda-string-to-lower'
