      ClusterId: !Ref EcsCluster
      ServiceToken: !GetAtt LambdaFunctionCognitoCreateUser.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-cognito-create-user'
      UserPoolId: !Ref UserPool
      WebPassword: !GetAtt LambdaRunnerWebPassword.RandomPassword
      WebUsername: !Ref CognitoAdminEmail
    Type: Custom::LambdaRunnerCognitoCreateUser

  LambdaRunnerDbPassword:
    Properties:
      Length: 16
      ServiceToken: !GetAtt LambdaFunctionRandomString.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-db-password'
    Type: Custom::LambdaRunnerDbPassword

  LambdaRunnerG2ConfigTool:
    # Unconditional: Senzing config is a prerequisite for any DB use (like the
    # init-postgres schema step). The redoer/loader services DependsOn this.
    DependsOn:
      - LambdaRunnerInitPgvector
    Properties:
      ClusterId: !Ref EcsCluster
      RunTaskParameters:
        # https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/ecs.html#ECS.Client.run_task
        cluster: !Ref EcsCluster
        count: 1
        launchType: FARGATE
        networkConfiguration:
          awsvpcConfiguration:
            assignPublicIp: DISABLED
            securityGroups:
              - !Ref Ec2SecurityGroupLambdaRunner
            # Pinned to AZ1 (writer AZ) to keep one-shot DB setup same-AZ.
            subnets:
              - !Ref Ec2SubnetPrivate1
        platformVersion: 1.4.0
        tags:
          - key: Name
            value: !Sub '${AWS::StackName}-lambda-runner-g2configtool-run-task-parameters'
        taskDefinition: !Ref EcsTaskDefinitionG2ConfigTool
      ServiceToken: !GetAtt LambdaFunctionRunTaskAndWait.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-g2configtool'
    Type: Custom::LambdaRunnerG2ConfigTool

  LambdaRunnerGenerateCertificate:
    Condition: IfUsingWeb
    Properties:
      CertificateAuthorityKeySize: 2048
      CertificateKeySize: 2048
      ClusterId: !Ref EcsCluster
      ServiceToken: !GetAtt LambdaFunctionGenerateCertificate.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-generate-certificate'
    Type: Custom::LambdaRunnerGenerateCertificate

  # LambdaRunnerInitDataEncryption:
  #   Properties:
  #     ClusterId: !Ref EcsCluster
  #     RunTaskParameters:
  #       # https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/ecs.html#ECS.Client.run_task
  #       cluster: !Ref EcsCluster
  #       count: 1
  #       launchType: FARGATE
  #       networkConfiguration:
  #         awsvpcConfiguration:
  #           assignPublicIp: DISABLED
  #           securityGroups:
  #             - !Ref Ec2SecurityGroupLambdaRunner
  #           subnets:
  #             - !Ref Ec2SubnetPrivate1
  #             - !Ref Ec2SubnetPrivate2
  #       platformVersion: 1.4.0
  #       tags:
  #         - key: Name
  #           value: !Sub "${AWS::StackName}-lambda-runner-init-data-encryption-run-task-parameters"
  #       taskDefinition: !Ref EcsTaskDefinitionInitDataEncryption
  #     ServiceToken: !GetAtt LambdaFunctionRunTaskAndWait.Arn
  #     Tags:
  #       - Key: Name
  #         Value: !Sub "${AWS::StackName}-lambda-runner-init-data-encryption"
  #   Type: Custom::LambdaRunnerInitDataEncryption

  LambdaRunnerInitPostgresConfiguration:
    DependsOn:
      - DbInstanceCore1Ready
      - DbClusterCoreReady
    Properties:
      ClusterId: !Ref EcsCluster
      RunTaskParameters:
        # https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/ecs.html#ECS.Client.run_task
        cluster: !Ref EcsCluster
        count: 1
        launchType: FARGATE
        networkConfiguration:
          awsvpcConfiguration:
            assignPublicIp: DISABLED
            securityGroups:
              - !Ref Ec2SecurityGroupLambdaRunner
            # Pinned to AZ1 (writer AZ) - this task creates the Senzing schema
            # via many DDL statements; same-AZ keeps setup latency stable across runs.
            subnets:
              - !Ref Ec2SubnetPrivate1
        platformVersion: 1.4.0
        tags:
          - key: Name
            value: !Sub '${AWS::StackName}-lambda-runner-init-postgres-configuration-run-task-parameters'
        taskDefinition: !Ref EcsTaskDefinitionInitPostgresConfiguration
      ServiceToken: !GetAtt LambdaFunctionRunTaskAndWait.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-init-postgres-configuration'
    Type: Custom::LambdaRunnerInitPostgresConfiguration

  # Runs the pgvector setup task after the Senzing schema exists and before the
  # config-tool step, so the embedding vector tables are present before any load.
  LambdaRunnerInitPgvector:
    # Unconditional: pgvector tables are a prerequisite for embedding storage.
    DependsOn:
      - LambdaRunnerInitPostgresConfiguration
    Properties:
      ClusterId: !Ref EcsCluster
      RunTaskParameters:
        # https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/ecs.html#ECS.Client.run_task
        cluster: !Ref EcsCluster
        count: 1
        launchType: FARGATE
        networkConfiguration:
          awsvpcConfiguration:
            assignPublicIp: DISABLED
            securityGroups:
              - !Ref Ec2SecurityGroupLambdaRunner
            # Pinned to AZ1 (writer AZ) to keep one-shot DB setup same-AZ.
            subnets:
              - !Ref Ec2SubnetPrivate1
        platformVersion: 1.4.0
        tags:
          - key: Name
            value: !Sub '${AWS::StackName}-lambda-runner-init-pgvector-run-task-parameters'
        taskDefinition: !Ref EcsTaskDefinitionInitPgvector
      ServiceToken: !GetAtt LambdaFunctionRunTaskAndWait.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-init-pgvector'
    Type: Custom::LambdaRunnerInitPgvector

  LambdaRunnerSenzingEngineConfigurationJson:
    DependsOn:
      - DbInstanceCore1Ready
      - DbClusterCoreReady
    Properties:
      DatabaseHostCore: !GetAtt RdsDbClusterCore.Endpoint.Address
      DatabaseHostLibfeat: !GetAtt RdsDbClusterCore.Endpoint.Address
      DatabaseHostRes: !GetAtt RdsDbClusterCore.Endpoint.Address
      DatabaseHostReader: !GetAtt RdsDbClusterCore.ReadEndpoint.Address
      DatabaseName: !FindInMap [Constants, Database, Name]
      DatabasePassword: !GetAtt LambdaRunnerDbPassword.RandomString
      DatabasePortCore: !GetAtt RdsDbClusterCore.Endpoint.Port
      DatabasePortLibfeat: !GetAtt RdsDbClusterCore.Endpoint.Port
      DatabasePortRes: !GetAtt RdsDbClusterCore.Endpoint.Port
      DatabasePortReader: !GetAtt RdsDbClusterCore.Endpoint.Port
      DatabaseUsername: !FindInMap [Constants, Database, Username]
      # DataEncryption: !FindInMap [DataEncryptionMap, !Ref RunDataEncryption, value]
      EnableEntityLockModeAdvisory: !Ref EnableEntityLockModeAdvisory
      EnableReadOnlyConnection: !Ref EnableReadOnlyConnection
      ReadOnlyConnections: !Ref ReadOnlyConnections
      # When read-offload is enabled, force the engine config to wait until the
      # reader replica is "available" by creating a graph edge via !Ref.
      # The Lambda ignores this property; CFN uses it to order the resources.
      ReaderInstanceId: !If
        - IfEnableReadOnlyConnection
        - !Ref RdsDbInstanceCore2
        - !Ref AWS::NoValue
      SenzingLicenseAsBase64: !Ref SenzingLicenseAsBase64
      ServiceToken: !GetAtt LambdaFunctionSenzingEngineConfigurationJson.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-senzing-engine-configuration-json'
    Type: Custom::LambdaRunnerSenzingEngineConfigurationJson

  LambdaRunnerSshPassword:
    Condition: IfRunSshd
    Properties:
      ClusterId: !Ref EcsCluster
      Length: 16
      ServiceToken: !GetAtt LambdaFunctionRandomString.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-ssh-password'
    Type: Custom::LambdaRunnerSshPassword

  LambdaRunnerStackNameAsLower:
    Properties:
      InputString: !Sub '${AWS::StackName}'
      ServiceToken: !GetAtt LambdaFunctionStringToLower.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-stack-name-as-lower'
    Type: Custom::LambdaRunnerStackNameAsLower

  LambdaRunnerStreamProducer:
    Condition: IfRunStreamProducer
    DependsOn:
      - LambdaRunnerG2ConfigTool
      - SqsInput
    Properties:
      ClusterId: !Ref EcsCluster
      RunTaskParameters:
        # https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/ecs.html#ECS.Client.run_task
        cluster: !Ref EcsCluster
        count: 1
        recordMax: !FindInMap [RecordMaxMap, !Ref RecordMax, value]
        recordMin: !FindInMap [Constants, StreamProducer, RecordMin]
        launchType: FARGATE
        networkConfiguration:
          awsvpcConfiguration:
            assignPublicIp: DISABLED
            securityGroups:
              - !Ref Ec2SecurityGroupLambdaRunner
            subnets:
              - !Ref Ec2SubnetPrivate1
              - !Ref Ec2SubnetPrivate2
        platformVersion: 1.4.0
        tags:
          - key: Name
            value: !Sub '${AWS::StackName}-lambda-runner-stream-producer-run-task-parameters'
        taskDefinition: !Ref EcsTaskDefinitionStreamProducer
      ServiceToken: !GetAtt LambdaFunctionRunStreamProducerTasks.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-stream-producer'
    Type: Custom::LambdaRunnerStreamProducer

  LambdaRunnerUserPoolDomainSuffix:
    Properties:
      Length: 8
      LowerCase: True
      ServiceToken: !GetAtt LambdaFunctionRandomString.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-user-domain-suffix'
    Type: Custom::LambdaRunnerUserPoolDomainSuffix

  LambdaRunnerWebPassword:
    Condition: IfUsingWeb
    Properties:
      ClusterId: !Ref EcsCluster
      Length: 16
      ServiceToken: !GetAtt LambdaFunctionRandomPassword.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-runner-web-password'
    Type: Custom::LambdaRunnerWebPassword

  # -- Load balancing -----------------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-elasticloadbalancingv2-loadbalancer.html
  # AWS Console: https://console.aws.amazon.com/ec2/v2/home?#LoadBalancers: > Search for {stack}

  LoadBalancerPrivate:
    Properties:
      Name: !Sub
        - '${StackNameAsLower}-alb-pvt'
        - StackNameAsLower: !GetAtt LambdaRunnerStackNameAsLower.OutputString
      Scheme: internal
      SecurityGroups:
        - !Ref Ec2SecurityGroupLoadBalancerPrivate
      Subnets:
        - !Ref Ec2SubnetPrivate1
        - !Ref Ec2SubnetPrivate2
      Tags:
        - Key: Name
          Value: !Sub
            - '${StackNameAsLower}-alb-pvt'
            - StackNameAsLower: !GetAtt LambdaRunnerStackNameAsLower.OutputString
      Type: application
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer

  LoadBalancerPublic:
    Condition: IfUsingWeb
    DependsOn: IamServerCertificate
    Properties:
      Name: !Sub
        - '${StackNameAsLower}-alb-public'
        - StackNameAsLower: !GetAtt LambdaRunnerStackNameAsLower.OutputString
      Scheme: internet-facing
      SecurityGroups:
        - !Ref Ec2SecurityGroupLoadBalancerPublic
      Subnets:
        - !Ref Ec2SubnetPublic1
        - !Ref Ec2SubnetPublic2
      Tags:
        - Key: Name
          Value: !Sub
            - '${StackNameAsLower}-alb-public'
            - StackNameAsLower: !GetAtt LambdaRunnerStackNameAsLower.OutputString
      Type: application
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-elasticloadbalancingv2-targetgroup.html
  # AWS Console: https://console.aws.amazon.com/ec2/v2/home?#TargetGroups: > Search for {stack}

  TargetGroupApiServerPrivate:
    Condition: IfUsingApiServer
    DependsOn:
      - LoadBalancerPrivate
    Properties:
      HealthCheckIntervalSeconds: 80
      HealthCheckPath: '/api/heartbeat'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 50
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200-299
      Name: !Sub '${AWS::StackName}-tg-api-pvt'
      Port: 8250
      Protocol: HTTP
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-tg-api-pvt'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
        - Key: slow_start.duration_seconds
          Value: '120'
      TargetType: ip
      UnhealthyThresholdCount: 5
      VpcId: !Ref Ec2Vpc
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

  TargetGroupApiServerPublic:
    Condition: IfUsingApiServer
    DependsOn:
      - LoadBalancerPublic
    Properties:
      HealthCheckIntervalSeconds: 80
      HealthCheckPath: '/api/heartbeat'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 50
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200-299
      Name: !Sub '${AWS::StackName}-tg-api-pub'
      Port: 8250
      Protocol: HTTP
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-tg-api-pub'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
        - Key: slow_start.duration_seconds
          Value: '120'
      TargetType: ip
      UnhealthyThresholdCount: 5
      VpcId: !Ref Ec2Vpc
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

  TargetGroupWebApp:
    Condition: IfRunWebApp
    DependsOn:
      - LoadBalancerPublic
    Properties:
      HealthCheckIntervalSeconds: 80
      HealthCheckPath: '/app/'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 50
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200-299
      Name: !Sub '${AWS::StackName}-tg-web-app'
      Port: 8251
      Protocol: HTTP
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-target-group-web-app'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
      TargetType: ip
      UnhealthyThresholdCount: 5
      VpcId: !Ref Ec2Vpc
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

  TargetGroupWebAppWss:
    Condition: IfRunWebApp
    DependsOn:
      - LoadBalancerPublic
    Properties:
      Matcher:
        HttpCode: 200-299
      Name: !Sub '${AWS::StackName}-tg-web-wss'
      Port: 8255
      Protocol: HTTP
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-tg-web-wss'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
      TargetType: ip
      VpcId: !Ref Ec2Vpc
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-elasticloadbalancingv2-listener.html
  # AWS Console: https://console.aws.amazon.com/ec2/v2/home?#LoadBalancers: > {name} > "Listeners" tab

  ListenerApiServerPrivate:
    Condition: IfUsingApiServer
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref TargetGroupApiServerPrivate
          Type: forward
      LoadBalancerArn: !Ref LoadBalancerPrivate
      Port: 8250
      Protocol: HTTP
    Type: AWS::ElasticLoadBalancingV2::Listener

  ListenerPort443:
    Condition: IfUsingWeb
    Properties:
      Certificates:
        - CertificateArn: !GetAtt IamServerCertificate.Arn
      DefaultActions:
        - Order: 1
          RedirectConfig:
            Host: hub.senzing.com
            Path: /aws-cloudformation-ecs-poc-simple/
            Port: '443'
            Protocol: HTTPS
            StatusCode: HTTP_301
          Type: redirect
      LoadBalancerArn: !Ref LoadBalancerPublic
      Port: 443
      Protocol: HTTPS
    Type: AWS::ElasticLoadBalancingV2::Listener

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-elasticloadbalancingv2-listenerrule.html
  # AWS Console: https://console.aws.amazon.com/ec2/v2/home?#LoadBalancers: > {name} > "Listeners" tab > "View/edit rules"

  ListenerRuleApiServer:
    Condition: IfUsingApiServer
    Properties:
      Actions:
        - AuthenticateCognitoConfig:
            OnUnauthenticatedRequest: authenticate
            Scope: openid
            UserPoolArn: !GetAtt 'UserPool.Arn'
            UserPoolClientId: !Ref UserPoolClient
            UserPoolDomain: !Ref UserPoolDomain
          Order: 1
          Type: authenticate-cognito
        - Type: 'forward'
          TargetGroupArn: !Ref TargetGroupApiServerPublic
          Order: 2
      Conditions:
        - Field: 'path-pattern'
          Values:
            - '/api/*'
            - '/api'
      ListenerArn: !Ref ListenerPort443
      Priority: 2
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'

  ListenerRuleWebApp:
    Condition: IfRunWebApp
    Properties:
      Actions:
        - AuthenticateCognitoConfig:
            OnUnauthenticatedRequest: authenticate
            Scope: openid
            UserPoolArn: !GetAtt 'UserPool.Arn'
            UserPoolClientId: !Ref UserPoolClient
            UserPoolDomain: !Ref UserPoolDomain
          Order: 1
          Type: authenticate-cognito
        - Type: 'forward'
          TargetGroupArn: !Ref TargetGroupWebApp
          Order: 2
      Conditions:
        - Field: 'path-pattern'
          Values:
            - '/app/*'
            - '/app'
      ListenerArn: !Ref ListenerPort443
      Priority: 6
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'

  ListenerRuleWebAppWss:
    Condition: IfRunWebApp
    Properties:
      Actions:
        - AuthenticateCognitoConfig:
            OnUnauthenticatedRequest: authenticate
            Scope: openid
            UserPoolArn: !GetAtt 'UserPool.Arn'
            UserPoolClientId: !Ref UserPoolClient
            UserPoolDomain: !Ref UserPoolDomain
          Order: 1
          Type: authenticate-cognito
        - Type: 'forward'
          TargetGroupArn: !Ref TargetGroupWebAppWss
          Order: 2
      Conditions:
        - Field: 'path-pattern'
          Values:
            - '/app/ws/*'
            - '/app/ws'
      ListenerArn: !Ref ListenerPort443
      Priority: 5
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'

  # -- UserPool -----------------------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cognito-userpool.html
  # AWS Console: https://console.aws.amazon.com/cognito/users/#/pool/u > Search for {stack}

  UserPool:
    Condition: IfUsingWeb
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailMessage: !Sub
            - |
              <html>
              <p>
                Your Cognito user id has been created.  Please allow the creation of the
                AWS stack to complete before logging in.
              </p>
              <p>
                  For first-time login to any of the links listed below, use these credentials:
                  <ul>
                      <li><b>Username:</b> {username}</li>
                      <li><b>OneTime Password:</b> {####}</li>
                  </ul>
              </p>
              <p>
                  You will be prompted to change your password.
                  This one-time password is valid for three weeks.
              </p>
              <p>
                  <b>Links:</b>
                  <ol>
                    <li>
                        <b>Senzing Entity Search web app: </b> <a href="https://${Host}/app">https://${Host}/app</a>
                        <br />
                        (For more details see the <a href="https://github.com/senzing-garage/entity-search-web-app">GitHub repository</a>)
                    </li>
                    <br />
                    <li>
                        <b>Senzing API Server: </b> <a href="https://${Host}/api/heartbeat">https://${Host}/api/heartbeat</a>
                        <br />
                        (For more details see the <a href="https://github.com/senzing-garage/senzing-api-server">GitHub repository</a>)
                    </li>
                  </ol>
              </p>
              <p>
                  For more information on the
                  <a href="https://github.com/senzing-garage/aws-cloudformation-ecs/tree/main/cloudformation/aws-cloudformation-ecs-staging-simple-100M">Senzing simple test install with selectable test data quantity</a>
                  "${AWS::StackName}"
                  AWS Cloudformation,
                  contact ${Contact}.
              </p>
              </html>
            - Contact: !Ref CognitoAdminEmail
              Host: !GetAtt LoadBalancerPublic.DNSName
          EmailSubject: !Sub 'Information for AWS Cloudformation ${AWS::StackName} stack'
          SMSMessage: 'Use the username {username} and the temporary password {####} to log in for the first time.'
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 16
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 21
      UsernameAttributes:
        - email
      UserPoolName: !Sub '${AWS::StackName}-user-pool'
    Type: AWS::Cognito::UserPool

  # -- UserPoolDomain -----------------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cognito-userpooldomain.html
  # AWS Console: https://console.aws.amazon.com/cognito/users/#/pool/u > Search for {stack} > "Domain name" tab

  UserPoolDomain: # Provides Cognito Login Page
    Condition: IfUsingWeb
    Properties:
      Domain: !Join
        - '-'
        - - !GetAtt LambdaRunnerStackNameAsLower.OutputString
          - !GetAtt LambdaRunnerUserPoolDomainSuffix.RandomString
      UserPoolId: !Ref UserPool
    Type: AWS::Cognito::UserPoolDomain

  # -- UserPoolClient -----------------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cognito-userpoolclient.html
  # AWS Console: https://console.aws.amazon.com/cognito/users/#/pool/u > Search for {stack} > "App client settings" tab

  UserPoolClient:
    Condition: IfUsingWeb
    Properties:
      AllowedOAuthFlows:
        - code # Required for ALB authentication
      AllowedOAuthFlowsUserPoolClient: true # Required for ALB authentication
      AllowedOAuthScopes:
        - openid
      CallbackURLs:
        - !Sub 'https://${LoadBalancerPublic.DNSName}/oauth2/idpresponse'
      GenerateSecret: true
      SupportedIdentityProviders: # Optional: add providers for identity federation
        - COGNITO
      UserPoolId: !Ref UserPool
    Type: AWS::Cognito::UserPoolClient

  # -- EcsTaskDefinition --------------------------------------------------------

  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-ecs-taskdefinition.html
  # AWS Console: https://console.aws.amazon.com/ecs/home?#/taskDefinitions > Search for {stack}

  EcsTaskDefinitionApiServer:
    Condition: IfUsingApiServer
    Properties:
      ContainerDefinitions:
        - Environment:
            - Name: SENZING_API_SERVER_ALLOWED_ORIGINS
              Value: '*'
            - Name: SENZING_API_SERVER_BIND_ADDR
              Value: all
            - Name: SENZING_API_SERVER_ENABLE_ADMIN
              Value: 'true'
            - Name: SENZING_API_SERVER_INIT_JSON
              Value: !GetAtt SsmParameterSenzingEngineConfigurationJson.Value
            - Name: SENZING_API_SERVER_PORT
              Value: '8250'
            - Name: SENZING_API_SERVER_SKIP_ENGINE_PRIMING
              Value: 'true'
            - Name: SENZING_API_SERVER_SKIP_STARTUP_PERF
              Value: 'true'
            - Name: SENZING_API_SERVER_URL_BASE_PATH
              Value: /api
            - Name: SENZING_API_SERVER_DEBUG
              Value: 'false'
            - Name: SENZING_API_SERVER_VERBOSE
              Value: 'false'
            - Name: SENZING_ENGINE_CONFIGURATION_JSON
              Value: !GetAtt SsmParameterSenzingEngineConfigurationJson.Value
            - Name: SENZING_SQS_LOAD_QUEUE_URL
              Value: !If [IfUsingQueues, !Ref SqsInput, '']
            - Name: SENZING_SQS_INFO_QUEUE_URL
              Value: !If [IfUsingQueues, !Ref SqsOutput, '']
          Essential: true
          Image: !FindInMap [Constants, Images, ApiServer]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogsLogGroupMain
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: service
          Name: api-server
          PortMappings:
            - ContainerPort: 8250
              HostPort: 8250
              Protocol: tcp
          Privileged: false
          ReadonlyRootFilesystem: false
      Cpu: '2048'
      ExecutionRoleArn: !GetAtt IamRoleApiServer.Arn
      Family: !Sub '${AWS::StackName}-task-definition-api-server'
      Memory: '16384'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ecs-task-definition-api-server'
      TaskRoleArn: !GetAtt IamRoleApiServer.Arn
    Type: AWS::ECS::TaskDefinition

  EcsTaskDefinitionG2ConfigTool:
    Properties:
      ContainerDefinitions:
        - Command:
            - '/bin/bash'
            - '-c'
            - |
              set -euo pipefail
              # 1. Apply the data-source / feature / attribute / threshold config via
              #    sz_configtool, exporting the result to a file INSTEAD of saving it so
              #    the search profile can be added before the config is registered.
              printf '%s\n' "${SENZING_G2CONFIG_GTC}" > /tmp/G2Config.gtc
              /opt/senzing/er/bin/sz_configtool -f /tmp/G2Config.gtc
              # 2. Add the EMBEDDED_SEARCH search profile. sz_configtool has no command
              #    for CFG_SPROFILE, so this script authors the row, resolving the real
              #    FTYPE_IDs the addFeature step above assigned.
              printf '%s' "${ADD_SEARCH_PROFILE_PY}" > /tmp/add_search_profile.py
              python3 /tmp/add_search_profile.py -i /tmp/g2config.json -o /tmp/g2config_new.json
              # 3. Import the completed config and register it as the default.
              printf 'importFromFile /tmp/g2config_new.json\nsave\n' > /tmp/G2Config-save.gtc
              /opt/senzing/er/bin/sz_configtool -f /tmp/G2Config-save.gtc
          Environment:
            - Name: SENZING_ENGINE_CONFIGURATION_JSON
              Value: !GetAtt SsmParameterSenzingEngineConfigurationJson.Value
            - Name: SENZING_G2CONFIG_GTC
              # Base data sources (kept from the standard template) + the OPEN_SANCTIONS
              # and ICIJ sources for embedding test data, plus the Senzing config needed
              # to STORE embeddings: two embedding feature types (NAME_EMBEDDING /
              # BIZNAME_EMBEDDING), load-only posture (behavior FF, candidates No,
              # comparison NULL_COMP = stored but not used for candidate generation),
              # their attributes, the name-scoring fragments (11/12), and thresholds.
              # NB: NULL_COMP must exist in the engine's default config. It was NOT in
              # 4.4.0-26204 (addFeature failed with "Comparison function 'NULL_COMP'
              # not found"); running 4.4.0-26232 now — confirm in the g2configtool log
              # that NULL_COMP resolves (Feature successfully added).
              # NB: addComparisonThreshold uses execOrder (the input key); returnOrder in the
              # source draft is an output-only key and is silently ignored by sz_configtool.
              Value: |
                addDataSource CUSTOMERS
                addDataSource REFERENCE
                addDataSource WATCHLIST
                addDataSource OPEN_SANCTIONS
                addDataSource ICIJ
                addFeature {"feature": "NAME_EMBEDDING", "class": "ISSUED_ID", "behavior": "FF", "anonymize": "No", "candidates": "No", "comparison": "NULL_COMP", "matchKey": "Yes", "version": 1, "elementList": [{"element": "EMBEDDING", "expressed": "No", "compared": "Yes", "derived": "Yes", "display": "No"}, {"element": "ALGORITHM", "expressed": "No", "compared": "Yes", "derived": "No", "display": "No"}, {"element": "LABEL", "expressed": "No", "compared": "No", "derived": "No", "display": "Yes"}]}
                addFeature {"feature": "BIZNAME_EMBEDDING", "class": "ISSUED_ID", "behavior": "FF", "anonymize": "No", "candidates": "No", "comparison": "NULL_COMP", "matchKey": "Yes", "version": 1, "elementList": [{"element": "EMBEDDING", "expressed": "No", "compared": "Yes", "derived": "Yes", "display": "No"}, {"element": "ALGORITHM", "expressed": "No", "compared": "Yes", "derived": "No", "display": "No"}, {"element": "LABEL", "expressed": "No", "compared": "No", "derived": "No", "display": "Yes"}]}
                addAttribute {"attribute": "NAME_EMBEDDING", "class": "IDENTIFIER", "feature": "NAME_EMBEDDING", "element": "EMBEDDING", "required": "Yes", "default": null, "internal": "No"}
                addAttribute {"attribute": "NAME_ALGORITHM", "class": "IDENTIFIER", "feature": "NAME_EMBEDDING", "element": "ALGORITHM", "required": "No", "default": null, "internal": "Yes"}
                addAttribute {"attribute": "NAME_LABEL", "class": "IDENTIFIER", "feature": "NAME_EMBEDDING", "element": "LABEL", "required": "Yes", "default": null, "internal": "No"}
                addAttribute {"attribute": "BIZNAME_EMBEDDING", "class": "IDENTIFIER", "feature": "BIZNAME_EMBEDDING", "element": "EMBEDDING", "required": "Yes", "default": null, "internal": "No"}
                addAttribute {"attribute": "BIZNAME_ALGORITHM", "class": "IDENTIFIER", "feature": "BIZNAME_EMBEDDING", "element": "ALGORITHM", "required": "No", "default": null, "internal": "Yes"}
                addAttribute {"attribute": "BIZNAME_LABEL", "class": "IDENTIFIER", "feature": "BIZNAME_EMBEDDING", "element": "LABEL", "required": "Yes", "default": null, "internal": "No"}
                setFragment {"id": 11, "fragment": "SAME_NAME", "source": "./SUMMARY/BEHAVIOR/NAME[./SAME > 0] | ./FRAGMENT[./GNR_SAME_NAME>0]"}
                setFragment {"id": 12, "fragment": "CLOSE_NAME", "source": "./SUMMARY/BEHAVIOR/NAME[sum(./SAME | ./CLOSE) > 0] | ./FRAGMENT[./GNR_CLOSE_NAME>0]"}
                addComparisonThreshold {"function": "NULL_COMP", "execOrder": 1, "scoreName": "FULL_SCORE", "feature": "BIZNAME_EMBEDDING", "sameScore": 80, "closeScore": 60, "likelyScore": 43, "plausibleScore": 30, "unlikelyScore": 20}
                addComparisonThreshold {"function": "NULL_COMP", "execOrder": 1, "scoreName": "FULL_SCORE", "feature": "NAME_EMBEDDING", "sameScore": 80, "closeScore": 50, "likelyScore": 30, "plausibleScore": 20, "unlikelyScore": 10}
                # Reconfigure the built-in SEMANTIC_VALUE feature (FTYPE 99) to the same
                # load-only posture as NAME_EMBEDDING / BIZNAME_EMBEDDING above: disable
                # candidate-list building and swap its scoring comparator to NULL_COMP
                # (stored but not used for candidates or scoring). setFeature cannot change a
                # comparison routine, so the existing SEMANTIC_SIMILARITY_COMP call is
                # deleted and re-added as NULL_COMP over the same elements (EMBEDDING,
                # ALGORITHM). NULL_COMP must already exist in the default config.
                setFeature {"feature": "SEMANTIC_VALUE", "candidates": "No"}
                deleteComparisonCall {"feature": "SEMANTIC_VALUE"}
                addComparisonCall {"feature": "SEMANTIC_VALUE", "comparison": "NULL_COMP", "elementList": [{"element": "EMBEDDING"}, {"element": "ALGORITHM"}]}
                save
                exportToFile /tmp/g2config.json
            - Name: ADD_SEARCH_PROFILE_PY
              # Embedded copy of dev/config/testing/add_search_profile.py (keep in
              # sync). Written to /tmp and run after sz_configtool to author the
              # EMBEDDED_SEARCH CFG_SPROFILE row (no config-tool command exists for it).
              Value: |
                #!/usr/bin/env python3
                """Add a search profile (CFG_SPROFILE row) to a g2config document.

                Workflow this script is the second half of
                --------------------------------------------
                1. Start from a base g2config document (e.g. ``g2config.json__original``).
                2. Add the embedding feature types with the **Rust** ``sz_configtool``, e.g.::

                     sz_configtool -c <ini> -f add_embedding_features.szc

                   where ``add_embedding_features.szc`` contains::

                     addFeature {"feature": "NAME_EMBEDDING", "class": "ISSUED_ID", "behavior": "FF", ...}
                     addFeature {"feature": "BIZNAME_EMBEDDING", "class": "ISSUED_ID", "behavior": "FF", ...}
                     save

                   ``sz_configtool`` assigns each new feature its own ``FTYPE_ID`` (features seed
                   at 1000, so the first added feature becomes 1001, the next 1002, ...). This
                   script does **not** guess those ids -- it reads them back out of the config.
                3. Run **this** script against the config the tool produced. It resolves the
                   requested feature *codes* to the ``FTYPE_ID`` values the tool actually
                   assigned, then emits the CFG_SPROFILE row with a matching ``FTYPE_OVERRIDES``.

                ``sz_configtool`` has no ``addSearchProfile`` command, which is why the profile
                is authored here.

                Semantics implemented here mirror the engine's CFG_SPROFILE contract
                (see FAQ ``architecture/cfg-sprofile-spec``):

                * ``GPLAN_ID``            -- resolved from the generic-plan *code* via CFG_GPLAN.
                * ``DEFAULT_USED_FOR_CAND`` -- ``Normal`` (respect each feature's own
                  ``USED_FOR_CAND``) or ``Off`` (force every feature off as the base).
                * ``FTYPE_OVERRIDES``     -- itemized ``[{ftypeId,Y|N}, ...]`` in canonical
                  mini-format, ordered ascending by ``FTYPE_ID``. ``Y`` turns candidate-list
                  building on for that feature type, ``N`` turns it off. Overrides always win
                  over the base mode.
                """

                import argparse
                import json
                import sys


                def load_config(path):
                    with open(path, "r", encoding="utf-8") as handle:
                        config = json.load(handle)
                    if "G2_CONFIG" not in config:
                        raise SystemExit(f"error: {path!r} is not a g2config document (no G2_CONFIG key)")
                    return config


                def resolve_gplan_id(config, plan_code):
                    """Map a generic-plan code (e.g. 'SEARCH') to its GPLAN_ID."""
                    for row in config["G2_CONFIG"].get("CFG_GPLAN", []):
                        if row.get("GPLAN_CODE") == plan_code:
                            return row["GPLAN_ID"]
                    known = ", ".join(sorted(r.get("GPLAN_CODE", "?") for r in config["G2_CONFIG"].get("CFG_GPLAN", [])))
                    raise SystemExit(f"error: generic plan {plan_code!r} not found in CFG_GPLAN (known: {known})")


                def resolve_ftype_ids(config, feature_codes):
                    """Map each feature code to the FTYPE_ID that addFeature assigned it.

                    Fails loudly if any requested feature is missing -- that means the
                    addFeature step was not run through sz_configtool first.
                    """
                    by_code = {r["FTYPE_CODE"]: r["FTYPE_ID"] for r in config["G2_CONFIG"].get("CFG_FTYPE", [])}
                    resolved = {}
                    missing = []
                    for code in feature_codes:
                        if code in by_code:
                            resolved[code] = by_code[code]
                        else:
                            missing.append(code)
                    if missing:
                        raise SystemExit(
                            "error: feature type(s) not found in CFG_FTYPE: "
                            + ", ".join(missing)
                            + "\n       Run the addFeature step through sz_configtool before this script."
                        )
                    return resolved


                def next_sprofile_id(config):
                    ids = [r["SPROFILE_ID"] for r in config["G2_CONFIG"].get("CFG_SPROFILE", [])]
                    return (max(ids) + 1) if ids else 1


                def format_ftype_overrides(overrides):
                    """Serialize {ftypeId: 'Y'|'N'} to canonical mini-format, ordered by id.

                    e.g. {99:'Y', 1001:'Y', 1002:'Y'} -> "[{99,Y},{1001,Y},{1002,Y}]"
                    """
                    parts = [f"{{{ftype_id},{flag}}}" for ftype_id, flag in sorted(overrides.items())]
                    return "[" + ",".join(parts) + "]"


                def add_search_profile(config, *, code, desc, plan_code, default_used_for_cand, on_features, off_features):
                    g2 = config["G2_CONFIG"]
                    g2.setdefault("CFG_SPROFILE", [])

                    for row in g2["CFG_SPROFILE"]:
                        if row.get("SPROFILE_CODE") == code:
                            raise SystemExit(f"error: search profile {code!r} already exists (SPROFILE_ID {row['SPROFILE_ID']})")

                    gplan_id = resolve_gplan_id(config, plan_code)

                    # Resolve the feature codes we override to the ids the tool assigned.
                    overrides = {}
                    for ftype_id in resolve_ftype_ids(config, on_features).values():
                        overrides[ftype_id] = "Y"
                    for ftype_id in resolve_ftype_ids(config, off_features).values():
                        overrides[ftype_id] = "N"

                    row = {
                        "SPROFILE_ID": next_sprofile_id(config),
                        "SPROFILE_CODE": code,
                        "SPROFILE_DESC": desc if desc is not None else code,
                        "GPLAN_ID": gplan_id,
                        "DEFAULT_USED_FOR_CAND": default_used_for_cand,
                        "FTYPE_OVERRIDES": format_ftype_overrides(overrides),
                    }
                    g2["CFG_SPROFILE"].append(row)
                    return row


                def parse_args(argv):
                    parser = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
                    parser.add_argument("-i", "--input", default="g2config.json__original",
                                        help="input g2config document (after addFeature has run)")
                    parser.add_argument("-o", "--output", default="g2config.json",
                                        help="output g2config document to write")
                    parser.add_argument("--profile", default="EMBEDDED_SEARCH", help="SPROFILE_CODE for the new profile")
                    parser.add_argument("--desc", default=None, help="SPROFILE_DESC (defaults to the profile code)")
                    parser.add_argument("--generic-plan", default="SEARCH", help="generic plan code -> GPLAN_ID")
                    parser.add_argument("--candidates", default="Normal", choices=["Normal", "Off"],
                                        help="DEFAULT_USED_FOR_CAND base mode")
                    parser.add_argument("--on", nargs="+", default=["SEMANTIC_VALUE", "NAME_EMBEDDING", "BIZNAME_EMBEDDING"],
                                        help="feature codes to turn candidate-list building ON")
                    parser.add_argument("--off", nargs="+", default=[],
                                        help="feature codes to turn candidate-list building OFF")
                    parser.add_argument("--print-only", action="store_true",
                                        help="print the generated CFG_SPROFILE row without writing the output file")
                    return parser.parse_args(argv)


                def main(argv=None):
                    args = parse_args(sys.argv[1:] if argv is None else argv)

                    config = load_config(args.input)
                    row = add_search_profile(
                        config,
                        code=args.profile,
                        desc=args.desc,
                        plan_code=args.generic_plan,
                        default_used_for_cand=args.candidates,
                        on_features=args.on,
                        off_features=args.off,
                    )

                    print("Generated CFG_SPROFILE entry:")
                    print(json.dumps(row, indent=4))

                    if not args.print_only:
                        with open(args.output, "w", encoding="utf-8") as handle:
                            json.dump(config, handle, indent=4)
                            handle.write("\n")
                        print(f"\nWrote {args.output}")

                    return 0


                if __name__ == "__main__":
                    raise SystemExit(main())
          Essential: true
